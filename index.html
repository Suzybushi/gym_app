<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="铁馆">
<meta name="theme-color" content="#0d0f14">
<title>铁馆 · 训练记录</title>
<style>
  :root{
    --bg:#0d0f14; --card:#171a21; --card2:#1f2430; --line:#2a3140;
    --txt:#e8ecf2; --dim:#8b94a7; --accent:#4f8cff; --accent2:#31c48d;
    --warn:#ffb020; --danger:#ff5470;
    --r:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Helvetica Neue",Arial,sans-serif;
    font-size:16px; -webkit-text-size-adjust:100%;}
  body{padding-bottom:calc(24px + env(safe-area-inset-bottom));}
  input,button,textarea{font-family:inherit; color:inherit;}
  button{cursor:pointer; border:none; background:none;}

  /* 顶栏 */
  header{position:sticky; top:0; z-index:20; background:rgba(13,15,20,.86);
    backdrop-filter:saturate(160%) blur(12px);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid var(--line);}
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand{display:flex; flex-direction:column; line-height:1.2;}
  .brand b{font-size:18px; letter-spacing:.5px;}
  .brand span{font-size:12px; color:var(--dim); margin-top:2px;}
  .iconbtn{width:40px; height:40px; border-radius:12px; background:var(--card2);
    display:flex; align-items:center; justify-content:center; font-size:18px;}

  /* 循环日程条 */
  .cycle{display:flex; gap:8px; margin-top:12px;}
  .chip{flex:1; text-align:center; padding:8px 0; border-radius:12px; background:var(--card2);
    border:1px solid transparent; font-size:13px; color:var(--dim); position:relative;}
  .chip b{display:block; font-size:15px; color:var(--txt); margin-bottom:2px;}
  .chip.on{border-color:var(--accent); background:linear-gradient(180deg,#1c2740,#171a21); color:var(--accent);}
  .chip.on b{color:var(--accent);}
  .chip.rest.on{border-color:var(--accent2); color:var(--accent2);} .chip.rest.on b{color:var(--accent2);}

  main{padding:16px; max-width:640px; margin:0 auto;}

  .dayhead{display:flex; align-items:baseline; gap:10px; margin:4px 2px 14px;}
  .dayhead h1{font-size:22px; margin:0;}
  .dayhead .sub{color:var(--dim); font-size:13px;}
  .banner{background:linear-gradient(135deg,#1a2030,#171a21); border:1px solid var(--line);
    border-radius:var(--r); padding:14px 14px; margin-bottom:14px; font-size:13px; color:var(--dim); line-height:1.55;}
  .banner b{color:var(--txt);}

  /* 动作卡 */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    margin-bottom:12px; overflow:hidden;}
  .card > .top{display:flex; align-items:center; gap:10px; padding:14px; }
  .card .idx{width:26px; height:26px; border-radius:8px; background:var(--card2); color:var(--dim);
    display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;}
  .card .name{flex:1; font-size:16px; font-weight:600;}
  .card .scheme{font-size:11px; color:var(--dim); background:var(--card2); padding:3px 8px; border-radius:20px;}
  .card .caret{color:var(--dim); font-size:14px;}
  @media (prefers-reduced-motion: no-preference){ .card .caret{transition:transform .2s;} }
  .card.open > .top .caret{transform:rotate(90deg);}

  .alts{display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 12px 50px;}
  .alt{font-size:12px; padding:5px 10px; border-radius:20px; background:var(--card2); color:var(--dim); border:1px solid transparent;}
  .alt.on{background:#20304d; color:var(--accent); border-color:var(--accent);}

  .body{display:none; padding:0 14px 14px; border-top:1px solid var(--line);}
  .card.open > .body{display:block;}
  .lastline{font-size:12px; color:var(--dim); padding:10px 2px 6px; display:flex; align-items:center; justify-content:space-between;}
  .reuse{color:var(--accent); font-size:12px; padding:4px 10px; border-radius:20px; background:#18233b;}

  table.sets{width:100%; border-collapse:collapse;}
  table.sets td{padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.sets tr:last-child td{border-bottom:none;}
  .slabel{font-size:13px;} .slabel small{display:block; color:var(--dim); font-size:11px; margin-top:1px;}
  .slabel .warm{color:var(--accent2);} .slabel .fail{color:var(--warn);}
  .inp{width:100%; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    padding:9px 8px; font-size:16px; text-align:center; color:var(--txt);}
  .inp:focus{outline:none; border-color:var(--accent);}
  th.h{font-size:11px; color:var(--dim); font-weight:500; text-align:center; padding-bottom:2px;}
  th.hl{text-align:left;}

  /* 休息日 */
  .rest-card{background:linear-gradient(160deg,#14231d,#171a21); border:1px solid #24402f;}
  .rest-card h2{margin:0 0 4px; font-size:18px; color:var(--accent2);}
  .rest-card ul{margin:12px 0 0; padding-left:18px; line-height:1.7; font-size:14px; color:var(--txt);}
  .rest-card li{margin-bottom:6px;}

  .foot{color:var(--dim); font-size:12px; text-align:center; margin:22px 0 6px; line-height:1.6;}

  /* 营养卡片 */
  .nutri{background:linear-gradient(135deg,#1a1f2e,#171a21); border:1px solid var(--line); border-radius:var(--r); margin-bottom:14px; overflow:hidden;}
  .nutri > .top{display:flex; align-items:center; gap:10px; padding:12px 14px;}
  .nutri .icon{font-size:20px; flex-shrink:0;}
  .nutri .summary{flex:1; font-size:14px; color:var(--txt);}
  .nutri .summary small{display:block; color:var(--dim); font-size:12px; margin-top:2px;}
  .nutri .goal-row{display:flex; gap:6px; padding:0 14px 10px;}
  .nutri .gchip{flex:1; text-align:center; padding:8px 4px; border-radius:12px; background:var(--card2); border:1px solid transparent; font-size:13px; color:var(--dim);}
  .nutri .gchip.on{border-color:var(--accent); color:var(--accent);}
  .nutri .gchip.lose.on{border-color:var(--warn); color:var(--warn);}
  .nutri .wtrow{display:flex; align-items:center; gap:10px; padding:0 14px 12px;}
  .nutri .wtrow span{color:var(--dim); font-size:13px; flex-shrink:0;}
  .nutri .wtrow input{width:80px; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:8px; font-size:16px; text-align:center; color:var(--txt);}
  .nutri .wtrow input:focus{outline:none; border-color:var(--accent);}
  .nutri .macros{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:0 14px 14px;}
  .nutri .mchip{background:var(--card2); border-radius:12px; padding:10px; text-align:center;}
  .nutri .mchip .val{font-size:20px; font-weight:700; color:var(--txt);}
  .nutri .mchip .lbl{font-size:11px; color:var(--dim); margin-top:2px;}

  /* 导入弹层 */
  .sheet{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); display:none;}
  .sheet.on{display:block;}
  .sheet .panel{position:absolute; left:0; right:0; bottom:0; background:var(--bg);
    border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:92vh; overflow:auto; border-top:1px solid var(--line);}
  .sheet h3{margin:2px 0 4px; font-size:18px;}
  .sheet p.hint{color:var(--dim); font-size:13px; margin:0 0 12px; line-height:1.5;}
  textarea{width:100%; min-height:150px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:12px; font-size:14px; line-height:1.5; resize:vertical;}
  textarea:focus{outline:none; border-color:var(--accent);}
  .btn{display:block; width:100%; text-align:center; padding:14px; border-radius:14px; font-size:16px; font-weight:600;}
  .btn.primary{background:var(--accent); color:#fff; margin-top:12px;}
  .btn.ghost{background:var(--card2); color:var(--dim); margin-top:8px;}
  .preview{margin-top:14px;}
  .pday{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px;}
  .pday b{color:var(--accent);} .pday .rest{color:var(--accent2);}
  .pday ol{margin:8px 0 0; padding-left:20px; color:var(--dim); font-size:13px; line-height:1.6;}
  .toast{position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:var(--card2); border:1px solid var(--line); color:var(--txt); padding:10px 18px; border-radius:24px;
    font-size:14px; z-index:99; opacity:0; pointer-events:none;}
  @media (prefers-reduced-motion: no-preference){ .toast{transition:opacity .25s;} }
  .toast.on{opacity:1;}

  /* 首次启动选择弹层 */
  .startup-overlay{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.72);
    display:flex; align-items:center; justify-content:center; padding:20px;}
  .startup-overlay.hidden{display:none;}
  .startup-card{background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:28px 24px 24px; max-width:360px; width:100%; text-align:center;
    max-height:92vh; overflow:auto;}
  .startup-card .emoji{font-size:48px; margin-bottom:8px;}
  .startup-card h2{margin:0 0 4px; font-size:22px;}
  .startup-card .sub{color:var(--dim); font-size:13px; margin-bottom:24px; line-height:1.5;}
  .startup-card .btn-row{display:flex; flex-direction:column; gap:10px;}

  /* 修复计划：分组 / 要点 / 计时 / 完成 */
  .blockhead{display:flex; align-items:baseline; gap:8px; margin:18px 2px 10px;}
  .blockhead:first-of-type{margin-top:8px;}
  .blockhead .btitle{font-size:15px; font-weight:700; color:var(--txt); flex:1; min-width:0;}
  .blockhead .btime{font-size:11px; color:var(--dim); background:var(--card2); padding:2px 8px; border-radius:20px; flex-shrink:0;}
  .detail{white-space:pre-line; color:var(--dim); font-size:13px; line-height:1.65;
    background:var(--card2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin:10px 0 4px;}
  .timerbar{display:flex; align-items:center; gap:10px; padding:10px 0 4px; flex-wrap:wrap;}
  .timer-display{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums;
    letter-spacing:1px; color:var(--txt); min-width:86px;}
  .timer-btn{background:var(--card2); border:1px solid var(--line); border-radius:12px;
    padding:9px 14px; font-size:13px; color:var(--txt);}
  .timer-btn.go{background:#18233b; border-color:var(--accent); color:var(--accent);}
  .donebtn{background:var(--card2); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; font-size:12px; color:var(--dim); width:100%;}
  .donebtn.on{background:#173326; border-color:var(--accent2); color:var(--accent2);}
  .daily-body .card{background:var(--card2); margin-bottom:8px;}
  .daily-body .blockhead{margin:10px 0 8px;}
  .daily-note{color:var(--dim); font-size:12px; line-height:1.55; padding:2px 0 6px;}
  .guideitem{padding:10px 0; border-bottom:1px solid var(--line);}
  .guideitem:last-child{border-bottom:none; padding-bottom:0;}
  .guideitem b{font-size:14px; color:var(--txt);}
  .guideitem p{margin:4px 0 0; color:var(--dim); font-size:13px; line-height:1.65;}

  /* 内置计划选择 */
  .planlist{display:flex; flex-direction:column; gap:10px;}
  .planopt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
    padding:14px; border-radius:14px; background:var(--card2); border:1px solid var(--line);}
  .planopt .ico{font-size:24px; line-height:1; flex-shrink:0; margin-top:2px;}
  .planopt .ptxt{flex:1; min-width:0;}
  .planopt b{display:block; font-size:15px; color:var(--txt);}
  .planopt small{display:block; margin-top:3px; color:var(--dim); font-size:12px; line-height:1.45;}
  .planopt .tag{font-size:11px; color:var(--accent2); border:1px solid #24402f;
    background:#14231d; padding:2px 8px; border-radius:20px; flex-shrink:0;}
  .planopt.on{border-color:var(--accent); background:#1c2740;}
  .builtin-title{font-size:12px; color:var(--dim); margin:4px 0 8px;}
  .builtin-row{display:flex; flex-direction:column; gap:8px; margin-bottom:4px;}
</style>
</head>
<body>

<!-- 首次启动选择弹层 -->
<div class="startup-overlay hidden" id="startupOverlay">
  <div class="startup-card">
    <div class="emoji">🏋️</div>
    <h2>铁馆</h2>
    <p class="sub">训练记录，随心掌握。<br>选择一套内置计划，或导入你自己的计划。</p>
    <div class="planlist" id="startupPlans"></div>
    <button class="btn ghost" id="btnStartImport" style="margin-top:10px;">📥 导入我的计划</button>
  </div>
</div>

<header>
  <div class="hrow">
    <div class="brand"><b>铁馆</b><span id="planName">—</span></div>
    <button class="iconbtn" id="btnImport" title="导入/更换计划">＋</button>
	    <button class="iconbtn" id="btnExport" title="导出数据备份">⬇</button>
  </div>
  <div class="cycle" id="cycle"></div>
</header>

<main id="main"></main>

<!-- 导入弹层 -->
<div class="sheet" id="sheet">
  <div class="panel">
    <h3>导入 / 更换训练计划</h3>
    <p class="builtin-title">内置计划（切换不会删除历史记录）</p>
    <div class="builtin-row" id="builtinRow"></div>
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0 12px;">
    <p class="hint">把 AI 生成的训练计划整段粘贴进来（表格、编号 1. 、圆点 - 、markdown 标题 ## 都能认），点解析。解析后可预览，确认无误再导入。</p>
    <textarea id="raw" placeholder="例如：&#10;Day A 推力系统&#10;1. 上斜哑铃推胸&#10;2. 平板机器推胸&#10;...&#10;Day D 休息"></textarea>
    <button class="btn primary" id="btnParse">解析预览</button>
    <div class="preview" id="preview"></div>
    <button class="btn ghost" id="btnClose">取消</button>
	    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0 12px;">
	    <p class="hint" style="margin-bottom:8px;">💾 数据备份：导出全部训练记录为文件，换设备或重装后可恢复。</p>
	    <button class="btn ghost" id="btnLoadBackup" style="color:var(--accent2);">📥 导入数据备份</button>
	    <input type="file" id="fileBackup" accept=".json" style="display:none;">
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ========== 内置的默认计划（一打开就能用）========== */
const STRENGTH_PLAN = {
  name: "推-拉-腿-休 四日训练计划",
  protocol: "231协议 · 主/副项6组：预热2组(40-50%,8-10次) → 主攻3组(12-16RM,离心2秒,留1-2次) → 力竭1组(降重15%)",
  days: [
    { id:"A", type:"train", title:"推力系统", tag:"胸 / 前侧 / 核心防线",
      note:"锁定肩胛骨再推！上斜主攻胸部厚度，RKC 建立正面防线对抗骨盆前倾。练完按压胸小肌 2 分钟。",
      exercises:[
        { name:"上斜哑铃推胸", alts:["上斜器械推胸"], scheme:"231" },
        { name:"平板机器推胸", alts:[], scheme:"231" },
        { name:"哑铃侧平举", alts:[], scheme:"231" },
        { name:"RKC 平板支撑", alts:[], scheme:"fixed", sets:3, target:"20 秒" }
      ]},
    { id:"B", type:"train", title:"拉力系统", tag:"背 / 后束 / 上交叉修复",
      note:"划船靠肩胛骨相撞。面拉是修复肱骨前移的终极武器，重量放轻主打顶峰收缩 1 秒。",
      exercises:[
        { name:"宽距高位下拉", alts:["坐姿划船"], scheme:"231" },
        { name:"绳索面拉 Face Pull", alts:[], scheme:"231" },
        { name:"负重卷腹", alts:[], scheme:"fixed", sets:3, target:"12-15 次" }
      ]},
    { id:"C", type:"train", title:"腿部基座", tag:"激素引擎 / 下交叉修复",
      note:"绝对不能省。腿弯举专门强化腘绳肌，从后方把前倾的骨盆拉回中立位。",
      exercises:[
        { name:"腿举机 Leg Press", alts:["深蹲"], scheme:"231" },
        { name:"俯卧腿弯举", alts:["罗马尼亚硬拉 RDL"], scheme:"231" },
        { name:"坐姿提踵", alts:[], scheme:"fixed", sets:3, target:"力竭" }
      ]},
    { id:"D", type:"rest", title:"停机维护", tag:"散热与热修复",
      note:"不去健身房。让中枢神经彻底冷却；刷脂的话把 4 公里慢跑挂在今天。",
      recovery:[
        "解除上交叉：筋膜球压墙，滚压胸小肌，每侧 1-2 分钟",
        "解除下底盘：筋膜球压梨状肌画圈，释放代偿压力",
        "下交叉拉伸：跪姿弓箭步拉髂腰肌，每侧 30 秒"
      ]}
  ]
};

/* ========== 内置修复计划：Left AIC + Right BC ========== */
const REHAB_PLAN = {
  id: "rehab-v1",
  name: "Left AIC + Right BC 修复计划",
  profile: "典型 Left AIC + Right BC：左侧骨盆前倾右旋 + 右侧胸廓/臂链代偿，叠加下肢足弓支撑不足与核心抗伸展失能。",
  protocol: "沉左肋 · 松右侧 · 足底三点 · 核心抗伸展｜每周 2~3 个精力充沛日做 B1/B2，其余日做 A 方案",
  daily: {
    title: "碎片保底 · 方案 A",
    duration: "约 9 分钟",
    note: "每天 1~2 次，利用学习间歇完成；精力不足时无条件用它替代 B1/B2。",
    exercises: [
      { block:"① 呼吸重置", blockTime:"3 分钟",
        name:"仰卧 90-90 左侧偏置呼吸", scheme:"practice", sets:2, target:"5 次深呼吸", timer:60,
        detail:"仰卧屈髋屈膝 90 度踩墙，双膝夹紧泡沫轴或折叠毛巾，轻微抬起尾骨（后腰贴地，感受双侧尤其是左大腿后侧腘绳肌微微发力）。用嘴缓慢呼气 5~6 秒，同时主动将左侧下肋骨向下向内压沉，呼尽后停顿 3 秒，再保持腹部微紧用鼻轻吸气，感受后背尤其是左侧肩胛骨之间被气体撑开。" },
      { block:"② 右侧定点抑制", blockTime:"3 分钟",
        name:"泡沫轴静压右侧背阔肌/大圆肌", scheme:"practice", sets:1, target:"60 秒", timer:60,
        detail:"侧卧将泡沫轴压在右侧腋下后方的背阔肌与大圆肌处，找到最酸胀的痛点后停止滚动，配合缓慢深呼气静压 60 秒。严禁双侧平均分配时间，只做右侧为主。" },
      { block:"② 右侧定点抑制", blockTime:"3 分钟",
        name:"筋膜球静压右侧胸小肌", scheme:"practice", sets:1, target:"60 秒", timer:60,
        detail:"改用筋膜球抵墙，精准按压右侧锁骨下方、靠近肩关节前侧的胸小肌位置，静压 60 秒。严禁双侧平均分配时间，只做右侧为主。" },

const KEY = "gymlog.v1";

/* ========== 日期与循环推算 ========== */
function ymd(d){ const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function today(){ return ymd(new Date()); }
function daysBetween(a,b){ // b - a，按天；日期非法时按0处理，避免 NaN 污染循环推算
  const da=new Date(a+"T00:00:00"), d2=new Date(b+"T00:00:00");
  if(isNaN(da)||isNaN(d2)) return 0;
  return Math.round((d2-da)/86400000);
}
function todayIndex(){
  const n = (db.plan && db.plan.days && db.plan.days.length) || 0;
  if(n===0) return 0;                                  // 计划为空时兜底，避免除零 → NaN
  if(!db.anchor){ db.anchor = { date: today(), index:0 }; save(); }
  const diff = daysBetween(db.anchor.date, today());
  return ((db.anchor.index + diff) % n + n) % n;
}
function setTodayIndex(i){ db.anchor = { date: today(), index:i }; save(); render(); }

/* ========== 营养摄入计算 ========== */
// 参考 ACE-CPT 运动营养指南 + ISSN 运动营养立场 + 《中国居民膳食营养素参考摄入量》
const MACRO_TABLE = {
  gain:  { kcal:35, pro:2.0, cho:5.0, fat:1.0, label:"增肌", desc:"热量盈余 · 碳水充足" },
  shape: { kcal:30, pro:2.0, cho:4.0, fat:0.9, label:"塑型", desc:"维持热量 · 均衡配比" },
  lose:  { kcal:25, pro:2.2, cho:3.0, fat:0.7, label:"减重", desc:"热量缺口 · 高蛋白防掉肌" }
};
function calcNutri(weight,goal){
  const m = MACRO_TABLE[goal] || MACRO_TABLE.gain;
  const kg = Math.max(30, Math.min(200, weight||60));
  return { kcal:Math.round(m.kcal*kg), pro:Math.round(m.pro*kg), cho:Math.round(m.cho*kg), fat:Math.round(m.fat*kg) };
}

/* ========== 记录读写 ========== */
function todayLog(){
  const d=today();
  if(!db.logs[d]) db.logs[d]={ variant:{}, sets:{} };
  return db.logs[d];
}
function lastFor(exName){
  const dates = Object.keys(db.logs).filter(d=>d!==today()).sort().reverse();
  for(const d of dates){
    const s = db.logs[d].sets?.[exName];
    if(s && s.some(x=>x && (x.w||x.r||x.done))) return { date:d, sets:s };
  }
  return null;
}
function fmtLast(l){
  if(!l) return "";
  // 有重量→"20×12"；纯次数/计时（自重、平板支撑）→"20次"；校正动作→"2 组完成"
  const main = l.sets.filter(x=>x&&(x.w||x.r)).map(x=> x.w ? (x.w+"×"+(x.r||"?")) : (x.r+"次"));
  const uniq = [...new Set(main)];
  if(uniq.length) return uniq.slice(0,3).join("  ");
  const done = l.sets.filter(x=>x&&x.done).length;
  return done ? done+" 组完成" : "";
}

/* ========== 倒计时 ========== */
const activeTimers = new Set();
function stopAllTimers(){
  activeTimers.forEach(id=>clearInterval(id));
  activeTimers.clear();
}
function fmtClock(sec){
  const s=Math.max(0,Math.ceil(sec));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function timerWidget(seconds){
  const wrap=document.createElement("div"); wrap.className="timerbar";
  const disp=document.createElement("div"); disp.className="timer-display";
  disp.setAttribute("role","timer");
  const start=document.createElement("button"); start.type="button"; start.className="timer-btn go";
  const reset=document.createElement("button"); reset.type="button"; reset.className="timer-btn"; reset.textContent="重置";
  let remaining=seconds, endsAt=0, tick=null, running=false;
  const paint=()=>{ disp.textContent=fmtClock(remaining); };
  const settle=()=>{
    running=false;
    if(tick){ clearInterval(tick); activeTimers.delete(tick); tick=null; }
  };
  const syncBtn=()=>{
    start.textContent = running ? "暂停" : (remaining<=0 ? "重来" : (remaining<seconds ? "继续" : "开始"));
  };
  start.onclick=()=>{
    if(running){
      remaining=Math.max(0,(endsAt-Date.now())/1000);
      settle(); paint(); syncBtn(); return;
    }
    if(remaining<=0) remaining=seconds;
    running=true; endsAt=Date.now()+remaining*1000; start.textContent="暂停";
    tick=setInterval(()=>{
      remaining=(endsAt-Date.now())/1000;
      if(remaining<=0){
        remaining=0; paint(); settle(); syncBtn();
        toast("时间到 · 换边/下一组");
        if(navigator.vibrate) navigator.vibrate(200);
      } else paint();
    },250);
    activeTimers.add(tick);
  };
  reset.onclick=()=>{ settle(); remaining=seconds; paint(); syncBtn(); };
  paint(); syncBtn();
  wrap.appendChild(disp); wrap.appendChild(start); wrap.appendChild(reset);
  return wrap;
}

function exerciseCard(ex,i,prefix){

  const chosen = log.variant[slot] || ex.name;          // 当前选中的（主动作或替代）
  const exKey = slot+"·"+chosen;                        // 记录键：位置+动作名，区分同名动作与不同变体
  const isPractice = ex.scheme==="practice";
  const card=document.createElement("div"); card.className="card";

  const bodyId = "ex-body-"+String(slot).replace(/[^\w-]/g,"");
  const top=document.createElement("div"); top.className="top";
  top.setAttribute("role","button"); top.setAttribute("tabindex","0");
  top.setAttribute("aria-expanded","false"); top.setAttribute("aria-controls",bodyId);
  const badge = isPractice ? esc((ex.sets||1)+"组")
    : (ex.scheme==="fixed" ? esc((ex.sets||3)+"组") : "231");
  top.innerHTML=`<div class="idx">${i+1}</div>
    <div class="name">${esc(chosen)}</div>
    <div class="scheme">${badge}${ex.timer?" ⏱":""}</div>
    <div class="caret">›</div>`;
  const toggleOpen=()=>{ const isOpen=card.classList.toggle("open"); top.setAttribute("aria-expanded",String(isOpen)); };
  top.onclick=toggleOpen;
  top.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleOpen(); } };
  card.appendChild(top);

  // 替代动作：切换后重渲染整卡，让"上次"和已填数据切到该动作自己的记录
  if(ex.alts && ex.alts.length){
    const alts=document.createElement("div"); alts.className="alts";
    [ex.name, ...ex.alts].forEach(nm=>{
      const a=document.createElement("button");
      a.className="alt"+(nm===chosen?" on":"");
      a.textContent=nm;
      a.onclick=(e)=>{ e.stopPropagation();
        log.variant[slot] = (nm===ex.name ? undefined : nm); save();
        stopAllTimers();
        const fresh=exerciseCard(ex,i,prefix); fresh.classList.add("open"); card.replaceWith(fresh); };
      alts.appendChild(a);
    });
    card.appendChild(alts);
  }

  // 组记录
  const body=document.createElement("div"); body.className="body"; body.id=bodyId;

  // 完整做法要点
  if(ex.detail){
    const d=document.createElement("div"); d.className="detail"; d.textContent=ex.detail;
    body.appendChild(d);
  }
  // 时长类动作的倒计时
  if(ex.timer>0) body.appendChild(timerWidget(ex.timer));

  const last=lastFor(exKey);
  const lastline=document.createElement("div"); lastline.className="lastline";
  lastline.innerHTML=`<span>上次：${last?esc(fmtLast(last)):"—"}</span>`;
  if(last && !isPractice){
    const r=document.createElement("button"); r.className="reuse"; r.textContent="沿用上次";
    r.onclick=()=>{ log.sets[exKey]=JSON.parse(JSON.stringify(last.sets)); save();
      body.querySelectorAll("tr[data-si]").forEach(tr=>{ const si=+tr.dataset.si; const v=last.sets[si]||{};
        tr.querySelector(".w").value=v.w||""; tr.querySelector(".r").value=v.r||""; });
      toast("已填入上次数据"); };
    lastline.appendChild(r);
  }
  body.appendChild(lastline);

  const tbl=document.createElement("table"); tbl.className="sets";
  const rows=setRows(ex);
  const saved=log.sets[exKey]||[];

  if(isPractice){
    tbl.innerHTML=`<tr><th class="h hl">组</th><th class="h">目标</th><th class="h">完成</th></tr>`;
    rows.forEach((row,si)=>{
      const tr=document.createElement("tr"); tr.dataset.si=si;
      tr.innerHTML=`<td class="slabel"><span>${esc(row.label)}</span></td>
        <td class="slabel" style="text-align:center"><small>${esc(row.sub)}</small></td>
        <td></td>`;
      const btn=document.createElement("button"); btn.type="button"; btn.className="donebtn";
      const sync=()=>{
        const done=!!(log.sets[exKey] && log.sets[exKey][si] && log.sets[exKey][si].done);
        btn.classList.toggle("on",done);
        btn.textContent=done?"✓ 已完成":"完成";
        btn.setAttribute("aria-pressed",String(done));
      };
      btn.onclick=()=>{
        if(!log.sets[exKey]) log.sets[exKey]=[];
        const cur=log.sets[exKey][si]||{};
        cur.done=!cur.done;
        log.sets[exKey][si]=cur;
        save(); sync();
      };
      sync();
      tr.querySelector("td:last-child").appendChild(btn);
      tbl.appendChild(tr);
    });
    body.appendChild(tbl);
    card.appendChild(body);
    return card;
  }

  tbl.innerHTML=`<tr><th class="h hl">组</th><th class="h">重量 kg</th><th class="h">次数</th></tr>`;
  rows.forEach((row,si)=>{
    const tr=document.createElement("tr"); tr.dataset.si=si;
    const v=saved[si]||{};
    tr.innerHTML=`<td class="slabel"><span class="${esc(row.cls)}">${esc(row.label)}</span><small>${esc(row.sub)}</small></td>
      <td><input class="inp w" inputmode="decimal" aria-label="${esc(row.label)} 重量" value="${esc(v.w)}" placeholder="—"></td>
      <td><input class="inp r" inputmode="numeric" aria-label="${esc(row.label)} 次数" value="${esc(v.r)}" placeholder="—"></td>`;
    const commit=()=>{
      if(!log.sets[exKey]) log.sets[exKey]=[];
      log.sets[exKey][si]={ w:tr.querySelector(".w").value.trim(), r:tr.querySelector(".r").value.trim() };
      save();
    };
    tr.querySelector(".w").addEventListener("change",commit);
    tr.querySelector(".r").addEventListener("change",commit);
    tbl.appendChild(tr);
  });
  body.appendChild(tbl);
  card.appendChild(body);
  return card;
}

let toastT;

  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1600); }

/* ========== 导入解析 ========== */
function normalize(text){
  // 先按真实换行分行（此时 <br> 还在），保证表格行不被 <br> 拆散
  const t=text.replace(/\*\*/g,"").replace(/\r/g,"");
  const out=[];
  t.split("\n").forEach(rawLine=>{
    const pipes=(rawLine.match(/\|/g)||[]).length;
    let cells;
    if(pipes>=2){
      if(/^[\s|:\-]+$/.test(rawLine)) return;          // 表格分隔线 |---|
      cells=rawLine.split("|");                          // 先按列拆
    } else cells=[rawLine];
    cells.forEach(cell=>{                                // 再在单元格内处理 <br>
      cell.replace(/<br\s*\/?>/gi,"\n").split("\n").forEach(x=>{ const s=x.trim(); if(s) out.push(s); });
    });
  });
  return out;
}
const DAY_RE = /^(day\s*[a-z]|第\s*[0-9一二三四五六七]{1,2}\s*天|周[一二三四五六日天])/i;
const REST_RE = /(停机|休息|不去健身房|rest|off day)/i;
const EX_RE   = /^\s*\d+\s*[\.\、\)]\s*/;                 // 编号动作：1. 2、 3)
const BULLET_RE = /^\s*[-*·•]\s+\S/;                       // 圆点动作：- 卧推
const MOD_RE  = /(推力|拉力|腿部|上肢|下肢|推日|拉日|腿日)/;  // 无 Day 标记时用于识别训练日标题

function parseExercise(raw){
  let s=raw.replace(EX_RE,"").replace(/^[·•\-\*]\s*/,"").trim();
  let scheme="231", sets=null, target="";
  const m=s.match(/[\(（]\s*(\d+)\s*组\s*[×xX*·]?\s*([^)）]*)[\)）]/);
  if(m){ scheme="fixed"; sets=parseInt(m[1]); target=(m[2]||"").trim(); s=s.replace(m[0],"").trim(); }
  let alts=[];
  s=s.replace(/[\(（]\s*或\s*([^)）]+)[\)）]/g,(mm,p)=>{ alts.push(p.trim()); return ""; }).trim();
  const parts=s.split(/\s*或\s*|\s*\/\s*/).map(x=>x.trim()).filter(Boolean);
  const name=parts.shift()||s;
  alts=alts.concat(parts);
  return { name, alts, scheme, sets, target };
}

// 识别的语法：Day A/第N天/周X 或 markdown 标题(##) 开一天；紧跟的短模块名(推力系统)并入标题，
// 括号行作为标签；编号或圆点行是动作；含休息词的行只有在当天还没动作时才判为休息日（避免"组间休息"误伤）。
function parsePlan(text){
  const lines=normalize(text);
  const days=[]; let cur=null;
  const startDay=(label)=>{ cur={ id:String.fromCharCode(65+days.length), type:"train",
    title:label||"", tag:"", note:"", exercises:[], recovery:[] }; days.push(cur); };
  const mergeTitle=(t)=>{ cur.title = cur.title ? (t?cur.title+" "+t:cur.title) : t; };
  lines.forEach(raw=>{
    const isHeader=/^#{1,6}\s+/.test(raw);
    const line=raw.replace(/^#{1,6}\s+/,"").trim();
    if(!line) return;
    const paren=/^[（(]/.test(line);
    const isEx=!paren && (EX_RE.test(line) || BULLET_RE.test(line));
    const dayMark=!paren && !isEx && DAY_RE.test(line);
    const modTitle=!paren && !isEx && MOD_RE.test(line) && line.length<=14;
    const curEmpty = cur && cur.exercises.length===0 && cur.recovery.length===0;

    // 1) 明确的一天边界：Day 标记，或 markdown 标题行
    if(dayMark || (isHeader && !isEx && !paren)){
      const label=line.replace(DAY_RE,"").trim();
      if(curEmpty) mergeTitle(label); else startDay(label);
      if(REST_RE.test(line) && cur) cur.type="rest";
      return;
    }
    // 2) 无 Day 标记的模块名：开第一天，或补当天标题；出现在动作之后则当噪音忽略（避免"核心"误拆天）
    if(modTitle){
      if(!cur) startDay(line);
      else if(curEmpty) mergeTitle(line);
      return;
    }
    if(!cur) startDay("");
    // 休息日：后续所有行（含圆点/编号）都当康复事项，而非动作
    if(cur.type==="rest"){ if(line.length<200) cur.recovery.push(line); return; }
    if(paren && !cur.tag && cur.exercises.length===0){ cur.tag=line.replace(/^[（(]|[)）]$/g,"").trim(); return; }
    if(isEx){ cur.exercises.push(parseExercise(line)); return; }
    if(REST_RE.test(line)){ if(cur.exercises.length===0){ cur.type="rest"; if(line.length<40) cur.recovery.push(line); } return; }
  });
  const good = days.filter(d=> d.exercises.length>0 || d.type==="rest");
  return good.length ? { name:"我的训练计划", protocol: SEED_PLAN.protocol, days:good } : null;
}

/* ========== 内置计划切换 ========== */
function clonePlan(p){ return JSON.parse(JSON.stringify(p)); }
function currentPlanKey(){
  if(!db.onboarded || !db.plan) return "";
  if(db.plan.id === "rehab-v1") return "rehab";
  const hit = BUILTIN_PLANS.find(p=>p.plan.name === db.plan.name);
  return hit ? hit.key : "";
}
function applyPlan(key){
  const item = BUILTIN_PLANS.find(p=>p.key === key);
  if(!item) return;
  db.plan = clonePlan(item.plan);
  db.anchor = { date: today(), index: 0 };
  db.onboarded = true;
  save();
  $("#startupOverlay").classList.add("hidden");
  $("#sheet").classList.remove("on");
  render();
  window.scrollTo(0,0);
  toast("已切换 · " + item.plan.name);
}
function choosePlan(key){
  if(key === currentPlanKey()){ toast("已是当前计划"); return; }
  applyPlan(key);
}
function fillPlanOptions(container, onPick){
  if(!container) return;
  container.innerHTML = "";
  const cur = currentPlanKey();
  BUILTIN_PLANS.forEach(item=>{
    const b=document.createElement("button"); b.type="button";
    b.className="planopt"+(item.key===cur?" on":"");
    const ico=document.createElement("span"); ico.className="ico"; ico.textContent=item.icon||"";
    const ptxt=document.createElement("span"); ptxt.className="ptxt";
    const title=document.createElement("b"); title.textContent=item.title||"";
    const desc=document.createElement("small"); desc.textContent=item.desc||"";
    ptxt.appendChild(title); ptxt.appendChild(desc);
    b.appendChild(ico); b.appendChild(ptxt);
    if(item.key===cur){
      const tag=document.createElement("span"); tag.className="tag"; tag.textContent="当前";
      b.appendChild(tag);
    }
    b.onclick=()=>onPick(item.key);
    container.appendChild(b);
  });
}

/* ========== 导入 UI ========== */
let pendingPlan=null;
$("#btnImport").onclick=()=>{
  fillPlanOptions($("#builtinRow"), choosePlan);
  $("#sheet").classList.add("on");
  $("#preview").innerHTML=""; pendingPlan=null;
  setTimeout(()=>$("#raw").focus(),100);
};
$("#btnClose").onclick=()=>{ $("#sheet").classList.remove("on");
  if(!db.onboarded){ $("#startupOverlay").classList.remove("hidden"); return; }
  $("#btnImport").focus(); };
$("#btnParse").onclick=()=>{
  const txt=$("#raw").value.trim();
  if(!txt){ toast("请先粘贴计划文本"); return; }
  const pv=$("#preview");
  let plan; try{ plan=parsePlan(txt); }catch(e){
    pv.innerHTML=`<p class="hint" style="color:var(--warn)">解析出错，请检查计划文本格式。</p>`; return; }
  if(!plan){ pv.innerHTML=`<p class="hint" style="color:var(--warn)">没能识别出结构，试试给每个动作前加编号（1. 2. 3.）和"Day A/B/C"标题。</p>`; return; }
  pendingPlan=plan;
  pv.innerHTML="";
  plan.days.forEach(d=>{
    const el=document.createElement("div"); el.className="pday";
    if(d.type==="rest"){ el.innerHTML=`<b class="rest">Day ${d.id} · 休息</b>`; }
    else{
      el.innerHTML=`<b>Day ${esc(d.id)} · ${esc(d.title||"训练")}</b>`;
      const ol=document.createElement("ol");
      d.exercises.forEach(ex=>{ const li=document.createElement("li");
        li.textContent=ex.name + (ex.alts.length?" （可换："+ex.alts.join("、")+"）":"")
          + (ex.scheme==="fixed"?"  ["+(ex.sets||3)+"组"+(ex.target?" "+ex.target:"")+"]":"  [231]");
        ol.appendChild(li); });
      el.appendChild(ol);
    }
    pv.appendChild(el);
  });
  const ok=document.createElement("button"); ok.className="btn primary"; ok.textContent="确认导入这份计划";
  ok.onclick=()=>{ db.plan=pendingPlan; db.anchor={date:today(),index:0}; db.onboarded=true; save();
    $("#sheet").classList.remove("on"); render(); toast("已导入 · 今天设为 Day A"); };
  pv.appendChild(ok);
};

/* ========== 数据导出/导入 ========== */
function exportBackup(){
  const backup = {
    version: "gymlog.v1",
    exportedAt: new Date().toISOString(),
    data: db
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "铁馆备份_" + today() + ".json";
  a.click();
  URL.revokeObjectURL(url);
  toast("备份已下载");
}

$("#btnExport").onclick = exportBackup;

$("#btnLoadBackup").onclick = ()=>{
  $("#fileBackup").click();
};

$("#fileBackup").addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup.data || !backup.data.plan || !backup.data.logs){
        toast("备份文件格式不正确"); return;
      }
      if(!confirm("确认导入此备份？当前所有数据将被覆盖。")) return;
      db = backup.data;
      save();
      $("#sheet").classList.remove("on");
      render();
      const d = backup.exportedAt ? new Date(backup.exportedAt).toLocaleString("zh-CN") : "未知";
      toast("数据已恢复 · 备份日期: " + d);
    } catch(err){
      toast("备份文件解析失败: " + err.message);
    }
  };
  reader.readAsText(file);
  this.value = ""; // 允许重复选同一文件
});

/* ========== 首次启动选择 ========== */
if(!db.onboarded){
  $("#startupOverlay").classList.remove("hidden");
  fillPlanOptions($("#startupPlans"), choosePlan);
  $("#btnStartImport").onclick = ()=>{
    $("#startupOverlay").classList.add("hidden");
    fillPlanOptions($("#builtinRow"), choosePlan);
    $("#preview").innerHTML=""; pendingPlan=null;
    $("#sheet").classList.add("on");
    setTimeout(()=>$("#raw").focus(),100);
  };
  // 如果用户通过导入面板取消了（没确认导入），再次打开应用时仍显示启动弹层
  // 如果用户从导入面板确认了导入，onboarded 会在确认时设为 true
} else {
  render();
}
</script>
</body>
</html>
